name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest -q
      - name: Catalog templates are up to date
        working-directory: .
        run: python scripts/build_catalog.py --check

  meegle-sdk-compile:
    # The Meegle digest template is built from a committed compile of the team's Workflow-SDK
    # code; recompile it to catch edits to the SDK source that weren't recompiled.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: scripts/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci --prefix scripts
      - run: pip install pydantic pyyaml
      - run: |
          node scripts/compile_n8n_sdk.mjs \
            demo-project/meegle-daily-digest/meegle-daily-digest.n8n-cloud-sdk.js /tmp/compiled.json
          python scripts/build_catalog.py --check-compiled /tmp/compiled.json

  services:
    # Modal apps (shared reader, Slack bot, the demo itself). The bot's demo patch must still apply
    # to the team's code, and the patched modules are tested without installing the bot's dependencies.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: services/slack-meegle-bot/check.sh
      - run: |
          pip install ruff
          ruff check --config app/backend/pyproject.toml services deploy
          ruff format --config app/backend/pyproject.toml --check services deploy
          python -m py_compile services/medium-reader/modal_app.py services/slack-meegle-bot/modal_app.py \
            deploy/modal_app.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          npm ci
          pip install -e ../backend
          npx playwright install --with-deps chromium
      - name: Typecheck, unit tests, build
        run: |
          npm run typecheck
          npm test
          npm run build
      - name: End-to-end tests (backend in fake-platform mode)
        run: npm run e2e
