# The whole demo on one server (AWS EC2, see docs/go-live.md):
#   docker compose up -d --build                  # everything except the Slack bot
#   docker compose --profile bot up -d --build    # also the Slack bot (only one copy may run anywhere)
# Settings (all git-ignored): .env here (infrastructure; template .env.example), ../production.env
# (the demo app; template ../production.env.example) and bot.env (the bot; template bot.env.example).
# Only Caddy is reachable from outside; the other services talk over the compose network.

name: workflow-demo

services:
  caddy:  # HTTPS for the two public hostnames; gets and renews the certificates itself
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DEMO_HOST: ${DEMO_HOST:?set DEMO_HOST in deploy/aws/.env}
      N8N_HOST: ${N8N_HOST:?set N8N_HOST in deploy/aws/.env}
      ADMIN_IP: ${ADMIN_IP:-127.0.0.1}  # set by deploy.sh: the only IP that may reach the n8n editor
      # Set by up.sh. The Caddyfile is a single-file mount that rsync replaces, so a change must
      # recreate the container to take effect; a new hash makes compose do that.
      CADDYFILE_HASH: ${CADDYFILE_HASH:-unset}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      demo:
        condition: service_healthy
      n8n:
        condition: service_started

  postgres:  # one server, two databases: workflow_demo (the demo) and n8n
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/aws/.env}
      DEMO_DB_PASSWORD: ${DEMO_DB_PASSWORD:?set DEMO_DB_PASSWORD in deploy/aws/.env}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD:?set N8N_DB_PASSWORD in deploy/aws/.env}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  demo:  # API + built frontend; deploy jobs and the sweeper run inside this one process
    build:
      context: ../..
      dockerfile: deploy/aws/demo.Dockerfile
    restart: unless-stopped
    env_file: ../production.env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy

  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:?set N8N_VERSION in deploy/aws/.env}
    restart: unless-stopped
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      # Encrypts the credentials stored in n8n: keep it stable.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in deploy/aws/.env}
      N8N_HOST: ${N8N_HOST}
      N8N_PROTOCOL: https
      N8N_PORT: "5678"
      WEBHOOK_URL: https://${N8N_HOST}/
      N8N_PROXY_HOPS: "1"
      GENERIC_TIMEZONE: ${TIMEZONE:-America/Los_Angeles}
      TZ: ${TIMEZONE:-America/Los_Angeles}
      # Code nodes run in the n8n-runner sidecar (external mode), isolated from n8n's data.
      N8N_RUNNERS_MODE: external
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN:?set N8N_RUNNERS_AUTH_TOKEN in deploy/aws/.env}
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"  # hours
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy

  n8n-runner:  # must be the same version as n8n
    image: n8nio/runners:${N8N_VERSION}
    restart: unless-stopped
    environment:
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN}
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n:5679
    depends_on:
      - n8n

  reader:  # the team's Medium reader (Freedium + CloakBrowser), from their own Dockerfile
    build: ../../demo-project/medium-digest-project/services/medium-reader
    restart: unless-stopped
    init: true
    shm_size: 1gb
    environment:
      API_TOKEN: ${READER_API_TOKEN:?set READER_API_TOKEN in deploy/aws/.env}
      FREEDIUM_BASE_URL: ${FREEDIUM_BASE_URL:-https://freedium-mirror.cfd}
      HEADLESS: "true"

  bot:  # the team's Slack → Meegle bot + services/slack-meegle-bot/demo.patch (Socket Mode)
    profiles: ["bot"]
    build:
      context: ../..
      dockerfile: deploy/aws/bot.Dockerfile
    restart: unless-stopped
    env_file:
      - path: bot.env
        required: false
    environment:
      USER_MAP_URL: http://demo:8000/api/bot/user-map
      CARD_EVENTS_URL: http://demo:8000/api/bot/cards
    depends_on:
      - demo

volumes:
  caddy_data:
  caddy_config:
  pg_data:
  n8n_data:
